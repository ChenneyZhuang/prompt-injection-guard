[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-injection-guard"
version = "0.1.0"
description = "AI agent for detecting prompt injection attacks in user input"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Chenney Zhuang", email = "dev@example.com"},
]
keywords = ["prompt-injection", "security", "llm", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.2",
    "mypy>=1.0",
]

[project.scripts]
guard = "guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guard"]

[tool.pytest.ini_options]
testpaths = ["src/guard/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
